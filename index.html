<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <link rel="stylesheet" href="css/leaflet-measure.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Race4Prali</title>
    <style>
    :root{
      --navy:#12324F;--navy-ink:#0C2338;--pine:#1B6E63;--pine-soft:#2E8A7C;
      --ice:#EFF5F4;--ice-2:#DFEAE8;--snow:#fff;--amber:#E8A13C;--amber-deep:#D18A1F;
      --easy:#2E8A5C;--medium:#2C6FA8;--hard:#B84A39;--gravity:#7A4FA3;
      --logo-navy:#1B3A5C;--logo-blue:#5C93C4;--logo-blue-deep:#3F6E9C;--logo-blue-light:#A7CDE7;
      --rail-bg:#1B3A5C;--rail-active:#E8A13C;--rail-hover:rgba(255,255,255,0.14);
      --shadow:0 8px 24px rgba(12,35,56,.15);
      --topbar-h:76px;--rail-w:96px;--panel-w:300px;
      font-family:'Schibsted Grotesk',system-ui,'Segoe UI',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden}
    body{background:var(--ice);color:var(--navy-ink);font-family:'Schibsted Grotesk',system-ui,'Segoe UI',sans-serif}

    /* ---------- TOP BAR ---------- */
    #topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--snow);z-index:1600;
      display:flex;align-items:center;gap:18px;padding:0 18px;box-shadow:0 2px 14px rgba(12,35,56,.10)}
    #tb-logo{display:flex;align-items:center;gap:10px}
    #tb-logo img{height:62px;width:auto;display:block}
    #tb-logo .word{font-weight:800;font-size:17px;letter-spacing:.02em;color:var(--navy);line-height:1}
    #tb-logo .word em{font-style:normal;color:var(--amber-deep)}
    #tb-logo .tag{font-size:8.5px;color:var(--pine);font-weight:700;letter-spacing:.06em;margin-top:2px}
    #tb-nav{display:flex;gap:8px;margin-left:6px}
    #tb-nav button{border:0;background:var(--logo-blue);color:#fff;font-family:inherit;font-weight:700;font-size:13.5px;
      padding:9px 18px;border-radius:10px;cursor:pointer;transition:background .2s,transform .15s}
    #tb-nav button:hover{background:var(--logo-blue-deep);transform:translateY(-1px)}
    #tb-nav button.active{background:var(--logo-blue-light);color:var(--logo-navy)}
    #tb-nav button:focus-visible{outline:3px solid var(--logo-blue-light);outline-offset:2px}
    #tb-lang{margin-left:auto;display:flex;gap:6px}
    #tb-lang button{width:38px;height:38px;border-radius:50%;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;transition:all .2s}
    #tb-lang button[data-lang="it"]{border:0;background:var(--logo-navy);color:#fff;opacity:.9}
    #tb-lang button[data-lang="en"]{border:2px solid var(--logo-navy);background:transparent;color:var(--logo-navy)}
    #tb-lang button.sel{background:var(--logo-blue-light);border-color:var(--logo-blue-light);color:var(--logo-navy);opacity:1}
    #tb-lang button:focus-visible{outline:3px solid var(--logo-blue-light);outline-offset:2px}

    /* ---------- MAP ---------- */
    #map{position:fixed;top:var(--topbar-h);left:var(--rail-w);right:0;bottom:0;background:var(--ice);z-index:1}

    /* ---------- RAIL ---------- */
    #rail{position:fixed;left:0;top:var(--topbar-h);bottom:0;width:var(--rail-w);background:var(--rail-bg);z-index:1500;
      display:flex;flex-direction:column;align-items:stretch;padding:12px 8px;gap:6px}
    #rail button{width:100%;min-height:62px;border:0;border-radius:14px;background:transparent;cursor:pointer;color:#fff;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;
      transition:background .2s,transform .15s}
    #rail button .ic{font-size:22px;line-height:1;height:24px;display:flex;align-items:center;justify-content:center}
    #rail button .ic img{height:24px;width:auto;display:block;filter:brightness(1.6)}
    #rail button.sel .ic img{filter:none}
    /* MTB, road & facility icons are white line-art: leave white on the navy rail, invert to dark on the amber active state */
    #rail button[data-p="mtb"] .ic img,
    #rail button[data-p="road"] .ic img,
    #rail button[data-p="facilities"] .ic img{filter:none}
    #rail button[data-p="mtb"].sel .ic img,
    #rail button[data-p="road"].sel .ic img,
    #rail button[data-p="facilities"].sel .ic img{filter:invert(1)}
    /* geo.png is black line-art (opposite polarity from the icons above): invert to
       white on the navy rail by default, revert to black on the amber active state */
    #rail-geology .ic img{filter:invert(1)}
    #rail-geology.sel .ic img{filter:none}
    #rail button .lb{font-size:10.5px;font-weight:700;line-height:1.15;text-align:center;letter-spacing:.01em}
    #rail button:hover{background:var(--rail-hover);transform:translateY(-1px)}
    #rail button.sel{background:var(--rail-active);color:var(--navy-ink)}
    #rail button:focus-visible{outline:3px solid var(--logo-blue-light);outline-offset:2px}
    #rail .sep{width:70%;height:1.5px;background:rgba(255,255,255,.22);margin:4px auto}
    #rail .spacer{flex:1}

    /* ---------- SINGLE PANEL ---------- */
    #panel{position:fixed;left:var(--rail-w);top:var(--topbar-h);bottom:0;width:var(--panel-w);background:var(--snow);z-index:1400;
      box-shadow:14px 0 36px rgba(12,35,56,.14);transform:translateX(calc(-100% - 60px));
      transition:transform .4s cubic-bezier(.3,.85,.3,1);display:flex;flex-direction:column}
    #panel.on{transform:none}
    #p-head{display:flex;align-items:center;gap:9px;padding:16px 16px 10px}
    #p-head h2{font-size:16.5px;font-weight:800;color:var(--navy);line-height:1.2}
    #p-back{display:none;border:0;background:var(--ice);width:30px;height:30px;border-radius:50%;color:var(--pine);
      font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;flex:0 0 auto}
    #panel.detail-mode #p-back{display:block}
    #p-close{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:var(--ice);color:var(--navy);
      font-weight:800;cursor:pointer;font-family:inherit;flex:0 0 auto}
    #p-back:focus-visible,#p-close:focus-visible{outline:3px solid var(--amber)}
    #p-body{flex:1;overflow-y:auto;padding:2px 16px 20px;font-size:13px}

    /* list view */
    #rsearch{width:100%;border:1.5px solid var(--ice-2);background:var(--ice);border-radius:11px;font-family:inherit;
      font-size:13.5px;padding:9px 12px;margin-bottom:9px;color:var(--navy-ink)}
    #rsearch:focus{outline:2px solid var(--pine);border-color:transparent}
    .rrow{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;font-family:inherit;
      text-align:left;padding:9px 8px;border-radius:11px;cursor:pointer}
    .rrow:hover{background:var(--ice)}
    .rrow:focus-visible{outline:3px solid var(--amber)}
    .num{flex:0 0 27px;height:27px;border-radius:50%;color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
    .rrow .rn{font-size:13px;font-weight:700;color:var(--navy);line-height:1.25}
    .rrow .rm{font-size:11px;color:#5E7386;font-weight:500}
    .grp{font-size:11.5px;font-weight:800;color:#7A8FA0;letter-spacing:.04em;margin:13px 0 7px}
    .lrow{display:flex;gap:9px;align-items:center;font-weight:600;color:var(--navy);padding:7px 4px;cursor:pointer;border-radius:9px;font-size:13px}
    .lrow:hover{background:var(--ice)}
    .lrow input{width:16px;height:16px;accent-color:var(--pine);cursor:pointer}
    .frow{display:flex;gap:10px;align-items:center;padding:8px 6px;border-radius:11px;font-weight:600;color:var(--navy);font-size:12.5px;cursor:pointer}
    .frow:hover{background:var(--ice)}
    .frow .fi{flex:0 0 26px;text-align:center;font-size:16px}

    /* detail view */
    #d-tabs{display:none;gap:6px;padding:0 16px 10px}
    #panel.detail-mode #d-tabs{display:flex}
    #d-tabs button{flex:1;border:0;background:var(--ice);color:var(--navy);font-family:inherit;font-weight:800;
      font-size:12px;padding:9px 4px;border-radius:11px;cursor:pointer;transition:all .2s}
    #d-tabs button.sel{background:var(--navy);color:#fff}
    #d-tabs button:focus-visible{outline:3px solid var(--amber)}
    #d-idhead{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
    #d-num{flex:0 0 32px;height:32px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
    #d-name{font-size:17px;font-weight:800;color:var(--navy);line-height:1.2}
    #d-cat{font-size:12px;color:var(--pine);font-weight:700;margin-top:2px}
    #d-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
    .df{background:var(--ice);border-radius:12px;padding:9px 11px}
    .df .v{font-size:14px;font-weight:800;color:var(--navy)}
    .df .k{font-size:10.5px;color:#5E7386;font-weight:600;margin-top:1px}
    #d-desc{font-size:13px;line-height:1.6;color:#33485B;margin-top:12px}
    .stop{display:flex;gap:9px;align-items:center;font-size:12.5px;font-weight:600;color:#33485B;padding:5px 0}
    .stop .km{flex:0 0 48px;font-weight:800;color:var(--pine)}
    .placeholder{background:var(--ice);border:1.5px dashed var(--ice-2);border-radius:13px;padding:18px 14px;
      text-align:center;color:#7A8FA0;font-weight:600;font-size:12.5px;line-height:1.6;margin-top:6px}
    #d-actions{display:flex;gap:8px;margin-top:16px}
    .btn{border:0;font-family:inherit;font-weight:700;font-size:13px;padding:11px 17px;border-radius:999px;cursor:pointer;
      display:inline-block;text-align:center;text-decoration:none}
    .btn.primary{background:var(--amber);color:var(--navy-ink)}
    .btn.primary:hover{background:var(--amber-deep)}
    .btn.ghost{background:var(--ice);color:var(--navy)}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
    .note{font-size:10.5px;color:#94A6B4;margin-top:14px;line-height:1.5;font-weight:500}

    /* elevation profile chart */
    .ev-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:4px}
    .ev-wrap{position:relative;background:var(--ice);border-radius:13px;padding:10px 6px 4px;margin-top:6px}
    .ev-svg{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
    .ev-grid{stroke:var(--ice-2);stroke-width:1;vector-effect:non-scaling-stroke}
    .ev-ytick,.ev-xtick{font:600 9px 'Schibsted Grotesk',system-ui,sans-serif}
    .ev-ytick{fill:#5E7386}
    .ev-xtick{fill:#7A8FA0}
    .ev-area{fill-opacity:.14;stroke:none}
    .ev-line{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
    .ev-peak-dot{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
    .ev-peak-lbl{font:800 10px 'Schibsted Grotesk',system-ui,sans-serif;fill:var(--navy)}
    .ev-cross{stroke:var(--navy);stroke-width:1;vector-effect:non-scaling-stroke}
    .ev-hover-dot{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
    .ev-tip{position:absolute;top:6px;background:#fff;border-radius:10px;padding:6px 10px;
      box-shadow:0 8px 20px rgba(12,35,56,.2);pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap}
    .ev-tip-v{font-size:13px;font-weight:800;color:var(--navy)}
    .ev-tip-s{font-size:10px;font-weight:600;color:#5E7386;margin-top:1px}

    /* Geology login modal - Supabase Auth */
    #auth-modal{position:fixed;inset:0;background:rgba(12,35,56,.55);z-index:3000;
      display:flex;align-items:center;justify-content:center;padding:20px}
    #auth-modal[hidden]{display:none}
    .modal-card{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(12,35,56,.35);
      padding:28px 26px 24px;width:100%;max-width:340px;position:relative}
    .modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
      border:0;background:var(--ice);color:var(--navy);font-weight:800;cursor:pointer;font-family:inherit}
    .modal-close:focus-visible{outline:3px solid var(--amber)}
    .modal-card h2{font-size:18px;font-weight:800;color:var(--navy);margin:0 0 6px;padding-right:26px}
    .modal-sub{font-size:12.5px;color:#5E7386;line-height:1.5;margin:0 0 18px}
    .modal-card label{display:block;font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:14px}
    .modal-card input{display:block;width:100%;margin-top:6px;border:1.5px solid var(--ice-2);
      background:var(--ice);border-radius:10px;padding:10px 12px;font-family:inherit;
      font-size:13.5px;color:var(--navy-ink)}
    .modal-card input:focus{outline:2px solid var(--pine);border-color:transparent}
    .auth-error{background:#FBEAE8;color:#B84A39;font-size:12px;font-weight:600;
      padding:8px 12px;border-radius:9px;margin-bottom:14px}
    .auth-error[hidden]{display:none}
    .modal-card .btn.primary{width:100%;text-align:center;margin-top:2px}
    .modal-card .btn.primary[disabled]{opacity:.6;cursor:default}

    /* facility markers on the real map */
    .fac-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
      background:#fff;border:2.5px solid var(--pine);font-size:15px;box-shadow:0 2px 6px rgba(12,35,56,.3)}

    /* route hover tooltip */
    .leaflet-tooltip.route-tip{background:#fff;border:0;border-radius:12px;padding:10px 14px;
      box-shadow:0 10px 30px rgba(12,35,56,.22);white-space:normal;max-width:280px;
      display:flex;align-items:flex-start;gap:9px;font-family:'Schibsted Grotesk',system-ui,sans-serif}
    .leaflet-tooltip.route-tip::before{display:none}
    .leaflet-tooltip.route-tip .rt-dot{width:9px;height:9px;margin-top:4px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px rgba(12,35,56,.06)}
    .leaflet-tooltip.route-tip .rt-txt{display:flex;flex-direction:column;gap:4px;line-height:1.25;min-width:0}
    .leaflet-tooltip.route-tip .rt-name{font-size:12.5px;font-weight:800;color:var(--navy);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .leaflet-tooltip.route-tip .rt-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;
      font-size:10.5px;font-weight:600;color:#5E7386}
    .leaflet-tooltip.route-tip .rt-diff{font-size:9px;font-weight:800;letter-spacing:.03em;color:#fff;
      padding:2px 8px;border-radius:999px;text-transform:uppercase;line-height:1.5}

    /* difficulty legend control */
    .diff-legend{background:rgba(255,255,255,.94);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);
      font-family:'Schibsted Grotesk',sans-serif}
    .diff-legend .dl-t{font-size:10px;font-weight:800;color:#7A8FA0;letter-spacing:.05em;margin-bottom:6px;text-transform:uppercase}
    .diff-legend .dl-row{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--navy);padding:2px 0}
    .diff-legend .dl-sw{width:20px;height:4px;border-radius:2px;flex:0 0 auto}

    /* leaflet control cosmetic tweaks to match theme */
    .leaflet-control-zoom a{color:var(--navy)!important}
    .leaflet-bar a:hover{background:var(--ice)!important}

    /* base-map switcher (top-right) - the classic collapsed layers icon, expanding
       into two clickable picture thumbnails instead of a text list */
    .basemap-switch{display:flex;flex-direction:column;align-items:flex-start;
      background:#fff;border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
    .basemap-switch .bm-toggle{width:30px;height:30px;flex:0 0 auto;border:0;padding:0;
      display:block;cursor:pointer;
      background:#fff url('css/images/layers.png') no-repeat center;background-size:18px 18px}
    .leaflet-retina .basemap-switch .bm-toggle{background-image:url('css/images/layers-2x.png')}
    /* thumbnails slide down from under the toggle icon, which stays put */
    .basemap-switch .bm-thumbs{display:flex;flex-direction:column;gap:6px;padding:0 6px;
      max-height:0;overflow:hidden;transition:max-height .25s ease,padding-bottom .25s ease}
    .basemap-switch.expanded{border-radius:14px}
    .basemap-switch.expanded .bm-thumbs{max-height:130px;padding:0 6px 6px}
    .basemap-switch .bm-btn{position:relative;width:52px;height:52px;flex:0 0 auto;padding:0;margin:0;
      border-radius:9px;border:2.5px solid transparent;cursor:pointer;overflow:hidden;
      background-color:var(--ice);background-size:cover;background-position:center;
      transition:border-color .15s,transform .15s}
    .basemap-switch .bm-btn:hover{transform:translateY(-1px)}
    .basemap-switch .bm-btn.sel{border-color:var(--amber)}
    .basemap-switch .bm-btn:focus-visible,.basemap-switch .bm-toggle:focus-visible{
      outline:3px solid var(--logo-blue-light);outline-offset:2px}
    .basemap-switch .bm-label{position:absolute;left:0;right:0;bottom:0;background:rgba(12,35,56,.72);
      color:#fff;font:800 8.5px/1 'Schibsted Grotesk',system-ui,sans-serif;letter-spacing:.02em;
      text-transform:uppercase;text-align:center;padding:3px 0}

    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
    @media (max-width:760px){
      #tb-nav button{padding:8px 12px;font-size:12px}
      #tb-logo .tag{display:none}
      #panel{width:calc(100vw - var(--rail-w))}
    }
    </style>
</head>
<body>

    <!-- ============ TOP BAR ============ -->
    <header id="topbar">
      <div id="tb-logo">
        <img src="images/Logo_Race4Prali.png" alt="Race4Prali">
        <div><div class="word">RACE<em>4</em>PRALI</div><div class="tag" data-i="tagline">PEDALA D'ESTATE, VIVI D'INVERNO</div></div>
      </div>
      <nav id="tb-nav" aria-label="Main navigation">
        <button data-i="n_home">Home</button>
        <button data-i="n_data">Data Source</button>
        <button data-i="n_about">About</button>
        <button data-i="n_partners">Partners</button>
        <button data-i="n_contact">Contact Us</button>
      </nav>
      <div id="tb-lang" role="group" aria-label="Language">
        <button data-lang="it" class="sel">IT</button>
        <button data-lang="en">EN</button>
      </div>
    </header>

    <!-- ============ RAIL ============ -->
    <nav id="rail" aria-label="Bike types and facilities">
      <button data-p="mtb"><span class="ic" aria-hidden="true"><img src="images/MTB.png" alt=""></span><span class="lb" data-i="mtb">Mountain bike</span></button>
      <button data-p="ebike"><span class="ic" aria-hidden="true"><img src="images/e-bike.png" alt=""></span><span class="lb" data-i="ebike">E-bike</span></button>
      <button data-p="road"><span class="ic" aria-hidden="true"><img src="images/bike.png" alt=""></span><span class="lb" data-i="road">Road bike</span></button>
      <div class="sep"></div>
      <button data-p="facilities"><span class="ic" aria-hidden="true"><img src="images/facility.png" alt=""></span><span class="lb" data-i="facilities">Facilities</span></button>
      <button id="rail-geology"><span class="ic" aria-hidden="true"><img src="images/geo.png" alt=""></span><span class="lb" data-i="geology">Geology</span></button>
      <div class="spacer"></div>
    </nav>

    <!-- ============ SINGLE PANEL ============ -->
    <aside id="panel" aria-hidden="true">
      <div id="p-head">
        <button id="p-back" aria-label="Back to routes">&lsaquo;</button>
        <h2 id="p-title">&mdash;</h2>
        <button id="p-close" aria-label="Close panel">&#10005;</button>
      </div>
      <div id="d-tabs">
        <button class="sel" data-t="t1" data-i="tab1">Overview</button>
        <button data-t="t2" data-i="tab2">Elevation</button>
        <button data-t="t3" data-i="tab3">Photos</button>
      </div>
      <div id="p-body"></div>
    </aside>

    <!-- ============ GEOLOGY LOGIN MODAL (Supabase Auth) ============ -->
    <div id="auth-modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="auth-title-el">
        <button id="auth-close" class="modal-close" aria-label="Close">&#10005;</button>
        <h2 id="auth-title-el" data-i="auth_title">Geology Access</h2>
        <p class="modal-sub" data-i="auth_sub">Restricted area: sign in with your credentials to continue.</p>
        <div id="auth-error" class="auth-error" hidden></div>
        <form id="auth-form">
          <label><span data-i="auth_email">Email</span>
            <input type="email" id="auth-email" required autocomplete="username"></label>
          <label><span data-i="auth_password">Password</span>
            <input type="password" id="auth-password" required autocomplete="current-password"></label>

    /* flip GeoJSON [lng,lat] -> Leaflet [lat,lng]; return array of line-parts */
    function geojsonToLatLngs(geom){
        if(!geom) return [];
        var lines = geom.type==='MultiLineString' ? geom.coordinates
                  : geom.type==='LineString'      ? [geom.coordinates] : [];
        return lines.map(function(line){
            return line.map(function(c){ return [c[1], c[0]]; });
        });
    }

    /* ---- elevation profile: built from the real GPX trackpoints (attribute `ele`) ---- */
    function haversineKm(lat1,lon1,lat2,lon2){
        var R=6371, toRad=Math.PI/180;
        var dLat=(lat2-lat1)*toRad, dLon=(lon2-lon1)*toRad;
        var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
              Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)*Math.sin(dLon/2);
        return 2*R*Math.asin(Math.sqrt(a));
    }
    /* raw GPX elevation is noisy point-to-point; a small moving average keeps the
       profile's real shape while taming single-fix GPS jitter (matches how ascent/
       descent are commonly reported for these tracks). */
    function buildElevProfile(pointsFC){
        if(!pointsFC || !pointsFC.features || !pointsFC.features.length) return null;
        var raw=[], prev=null, cum=0;
        pointsFC.features.forEach(function(f){
            var g=f.geometry, p=f.properties||{};
            if(!g || g.type!=='Point' || p.ele==null || isNaN(p.ele)) return;
            var lon=g.coordinates[0], lat=g.coordinates[1];
            if(prev) cum += haversineKm(prev.lat,prev.lon,lat,lon);
            raw.push({d:cum, e:+p.ele, lat:lat, lon:lon});
            prev={lat:lat,lon:lon};
        });
        if(raw.length<2) return null;
        var win=5;
        var sm=raw.map(function(pt,i){
            var s=0,c=0,k;
            for(k=Math.max(0,i-win); k<=Math.min(raw.length-1,i+win); k++){ s+=raw[k].e; c++; }
            return {d:pt.d, e:s/c};
        });
        var distKm=sm[sm.length-1].d;
        if(distKm<=0) return null;
        function interpAt(target){
            var lo=0, hi=sm.length-1;
            if(target<=sm[0].d) return sm[0].e;
            if(target>=sm[hi].d) return sm[hi].e;
            while(hi-lo>1){
                var mid=(lo+hi)>>1;
                if(sm[mid].d<=target) lo=mid; else hi=mid;
            }
            var a=sm[lo], b=sm[hi], t=(target-a.d)/((b.d-a.d)||1);
            return a.e+(b.e-a.e)*t;
        }
        /* interpolate lat/lon (unsmoothed - the real track shape) at the same distance */
        function interpLatLngAt(target){
            var lo=0, hi=raw.length-1;
            if(target<=raw[0].d) return {lat:raw[0].lat, lng:raw[0].lon};
            if(target>=raw[hi].d) return {lat:raw[hi].lat, lng:raw[hi].lon};
            while(hi-lo>1){
                var mid=(lo+hi)>>1;
                if(raw[mid].d<=target) lo=mid; else hi=mid;
            }
            var a=raw[lo], b=raw[hi], t=(target-a.d)/((b.d-a.d)||1);
            return {lat:a.lat+(b.lat-a.lat)*t, lng:a.lon+(b.lon-a.lon)*t};
        }
        var N=120, pts=[], i;
        for(i=0;i<=N;i++){
            var target=distKm*i/N, ll=interpLatLngAt(target);
            pts.push({d:target, e:interpAt(target), lat:ll.lat, lng:ll.lng});
        }
        var minE=Infinity, maxE=-Infinity;
        pts.forEach(function(p){ if(p.e<minE) minE=p.e; if(p.e>maxE) maxE=p.e; });
        var ascent=0, descent=0;
        for(i=1;i<sm.length;i++){
            var diff=sm[i].e-sm[i-1].e;
            if(diff>0) ascent+=diff; else descent-=diff;
        }
        return {pts:pts, distKm:distKm, minE:minE, maxE:maxE, ascent:Math.round(ascent), descent:Math.round(descent)};
    }

    /* build the ROUTES model from the loaded track GeoJSON + classification */
    const ROUTES = [];

        var fc = src.json;

    /* real restaurants / cafes / bars from OpenStreetMap (data/restaurant_points.js,

    ].forEach(function(group){

    const UI = {
     it:{tagline:"PEDALA D'ESTATE, VIVI D'INVERNO",

    /* ---------------- elevation profile chart (SVG, colored by the route's own difficulty color) ---------------- */
    function fmtInt(n){
        n = Math.round(n);
        var out = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, lang==='it'?'.':',');
        return (n<0?'-':'')+out;
    }
    function fmtKm(km){
        var s = km.toFixed(1);
        return lang==='it' ? s.replace('.', ',') : s;
    }
    function niceStep(range){
        var raw = range/4;
        var mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
        var norm = raw/mag, step = norm<1.5?1:norm<3?2:norm<7?5:10;
        return step*mag;
    }
    var EV_W=280, EV_H=132, EV_PADL=36, EV_PADR=10, EV_PADT=16, EV_PADB=18;
    function elevLayout(ev){
        var plotW=EV_W-EV_PADL-EV_PADR, plotH=EV_H-EV_PADT-EV_PADB;
        var range=Math.max(ev.maxE-ev.minE, 10), pad=range*0.12;
        var rawMin=ev.minE-pad, rawMax=ev.maxE+pad;
        var step=niceStep(rawMax-rawMin);
        var domMin=Math.floor(rawMin/step)*step, domMax=Math.ceil(rawMax/step)*step;
        if(domMax===domMin) domMax=domMin+step;
        return {
            plotW:plotW, plotH:plotH, domMin:domMin, domMax:domMax, step:step,
            X:function(d){ return EV_PADL + (d/ev.distKm)*plotW; },
            Y:function(e){ return EV_PADT + plotH - ((e-domMin)/(domMax-domMin))*plotH; }
        };
    }
    function renderElevChart(r){
        var ev=r.elev;
        if(!ev) return '<div class="placeholder">📈<br>'+UI[lang].ph2+'</div>';
        var sc=elevLayout(ev), pts=ev.pts;
        var lineD = pts.map(function(p,i){ return (i===0?'M':'L')+sc.X(p.d).toFixed(1)+','+sc.Y(p.e).toFixed(1); }).join(' ');
        var baseY=(EV_PADT+sc.plotH).toFixed(1);
        var areaD = lineD+' L'+sc.X(pts[pts.length-1].d).toFixed(1)+','+baseY+
                    ' L'+sc.X(pts[0].d).toFixed(1)+','+baseY+' Z';
        var ticks=[], v;
        for(v=Math.ceil(sc.domMin/sc.step)*sc.step; v<=sc.domMax+0.01; v+=sc.step) ticks.push(v);
        var gridSvg = ticks.map(function(tv){
            var y=sc.Y(tv).toFixed(1);
            return '<line class="ev-grid" x1="'+EV_PADL+'" x2="'+(EV_PADL+sc.plotW)+'" y1="'+y+'" y2="'+y+'"/>'+
                   '<text class="ev-ytick" x="'+(EV_PADL-6)+'" y="'+(+y+3).toFixed(1)+'" text-anchor="end">'+fmtInt(tv)+'</text>';
        }).join('');
        var peakIdx=0;
        pts.forEach(function(p,i){ if(p.e>pts[peakIdx].e) peakIdx=i; });
        var peak=pts[peakIdx], px=sc.X(peak.d), py=sc.Y(peak.e);
        var anchor = px<EV_PADL+sc.plotW*0.18 ? 'start' : (px>EV_PADL+sc.plotW*0.82 ? 'end' : 'middle');
        var peakSvg = '<circle class="ev-peak-dot" cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.5" fill="'+r.col+'"/>'+
            '<text class="ev-peak-lbl" x="'+px.toFixed(1)+'" y="'+(py-8).toFixed(1)+'" text-anchor="'+anchor+'">'+fmtInt(peak.e)+' m</text>';
        var kmLabels = '<text class="ev-xtick" x="'+EV_PADL+'" y="'+(EV_H-4)+'" text-anchor="start">0 km</text>'+
            '<text class="ev-xtick" x="'+(EV_PADL+sc.plotW)+'" y="'+(EV_H-4)+'" text-anchor="end">'+fmtKm(ev.distKm)+' km</text>';
        var svg = '<svg class="ev-svg" viewBox="0 0 '+EV_W+' '+EV_H+'" role="img" aria-label="Elevation profile">'+
            gridSvg+
            '<path class="ev-area" d="'+areaD+'" fill="'+r.col+'"/>'+
            '<path class="ev-line" d="'+lineD+'" stroke="'+r.col+'"/>'+
            peakSvg + kmLabels +
            '<line class="ev-cross" x1="0" x2="0" y1="'+EV_PADT+'" y2="'+(EV_PADT+sc.plotH)+'" opacity="0"/>'+
            '<circle class="ev-hover-dot" r="4.5" fill="'+r.col+'" opacity="0"/>'+
            '</svg>';
        var statsHtml = '<div class="ev-stats">'+
            '<div class="df"><div class="v">'+fmtInt(ev.maxE)+' m</div><div class="k">'+UI[lang].f_max+'</div></div>'+
            '<div class="df"><div class="v">'+fmtInt(ev.minE)+' m</div><div class="k">'+UI[lang].f_min+'</div></div>'+
            '<div class="df"><div class="v">↗ '+fmtInt(ev.ascent)+' m</div><div class="k">'+UI[lang].f_asc+'</div></div></div>';
        return statsHtml+'<div class="ev-wrap" id="ev-wrap">'+svg+'<div class="ev-tip" id="ev-tip"></div></div>'+
            '<p class="note">'+UI[lang].elev_note+'</p>';
    }
    function wireElevHover(r){
        var wrap=document.getElementById('ev-wrap');
        if(!wrap) return;
        var svg=wrap.querySelector('.ev-svg'), cross=svg.querySelector('.ev-cross'),
            dot=svg.querySelector('.ev-hover-dot'), tip=document.getElementById('ev-tip');
        var ev=r.elev, pts=ev.pts, sc=elevLayout(ev);
        function nearestPoint(clientX){
            var rect=svg.getBoundingClientRect();
            var ratio=Math.min(Math.max((clientX-rect.left)/rect.width, 0), 1);
            var idx=Math.round(ratio*(pts.length-1));
            return pts[Math.max(0, Math.min(pts.length-1, idx))];
        }
        function show(clientX){
            var p=nearestPoint(clientX), x=sc.X(p.d), y=sc.Y(p.e);
            cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', 1);
            dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity', 1);
            tip.textContent='';
            var vEl=document.createElement('div'); vEl.className='ev-tip-v'; vEl.textContent=fmtInt(p.e)+' m';
            var sEl=document.createElement('div'); sEl.className='ev-tip-s';
            sEl.textContent=(lang==='it'?'a ':'at ')+fmtKm(p.d)+' km';
            tip.appendChild(vEl); tip.appendChild(sEl);
            var svgRect=svg.getBoundingClientRect(), ratio=svgRect.width/EV_W;
            var left=x*ratio - tip.offsetWidth/2;
            left=Math.max(4, Math.min(left, wrap.clientWidth - tip.offsetWidth - 4));
            tip.style.left=left+'px';
            tip.style.opacity=1;
            showElevMarker(p.lat, p.lng, r.col);
        }
        function hide(){
            cross.setAttribute('opacity',0); dot.setAttribute('opacity',0); tip.style.opacity=0;
            hideElevMarker();
        }
        svg.addEventListener('pointerdown', function(e){ try{ svg.setPointerCapture(e.pointerId); }catch(_){} show(e.clientX); });
        svg.addEventListener('pointermove', function(e){ show(e.clientX); });
        svg.addEventListener('pointerleave', hide);
        svg.addEventListener('pointerup', function(e){ if(e.pointerType==='touch') hide(); });
    }

        if(tab==='t1'){
            inner+='<div id="d-facts">'+
              '<div class="df"><div class="v">'+t.dist+'</div><div class="k">'+UI[lang].f_dist+'</div></div>'+
              '<div class="df"><div class="v">'+t.gain+'</div><div class="k">'+UI[lang].f_gain+'</div></div>'+
              '<div class="df"><div class="v">'+t.time+'</div><div class="k">'+UI[lang].f_time+'</div></div>'+
              '<div class="df"><div class="v">'+t.surf+'</div><div class="k">'+UI[lang].f_surf+'</div></div></div>'+
              '<p id="d-desc">'+t.desc+'</p>'+
              (r.stops.length ? '<div class="grp">'+UI[lang].h_stops+'</div>'+
              r.stops.map(function(s){ return '<div class="stop"><span class="km">'+s[0]+'</span><span>'+s[1]+'</span><span>'+s[2]+'</span></div>'; }).join('') : '')+
              '<div id="d-actions">'+(r.link
                ? '<a class="btn primary" href="'+r.link+'" target="_blank" rel="noopener">'+UI[lang].b_source+'</a>'
                : '<button class="btn primary" disabled>'+UI[lang].b_source+'</button>')+'</div>'+
              '<p class="note">'+UI[lang].geo_note+'</p>';
        }
        if(tab==='t2'){ inner+=renderElevChart(r); }
        if(tab==='t3'){ inner+='<div class="placeholder">🖼️<br>'+UI[lang].ph3+'</div>'; }
        pBody.innerHTML=inner;
        if(tab==='t2' && r.elev) wireElevHover(r);
        else hideElevMarker();
    }
    document.querySelectorAll('#d-tabs button').forEach(function(b){
        b.addEventListener('click', function(){
            tab=b.dataset.t;
            document.querySelectorAll('#d-tabs button').forEach(function(x){ x.classList.toggle('sel', x===b); });
            renderDetail();
        });
    });

    /* study-area (Prali municipality boundary) is always shown — added at init */

    /* ---------------- language ---------------- */
    document.querySelectorAll('#tb-lang button').forEach(function(b){
        b.addEventListener('click', function(){
            document.querySelectorAll('#tb-lang button').forEach(function(x){ x.classList.remove('sel'); });
            b.classList.add('sel'); lang=b.dataset.lang;
            document.querySelectorAll('[data-i]').forEach(function(el){
                var k=el.dataset.i; if(UI[lang][k]) el.textContent=UI[lang][k];
            });
            facMarkers.forEach(function(m){ m.setPopupContent(m.facRef[lang]); });
            ROUTES.forEach(function(r){ if(routeLines[r.n]) routeLines[r.n].setTooltipContent(routeTipHTML(r)); });
            if(panel.classList.contains('on')) renderPanel();
        });
    });
    /* apply default language (IT) labels once */
    document.querySelectorAll('[data-i]').forEach(function(el){
        var k=el.dataset.i; if(UI[lang][k]) el.textContent=UI[lang][k];
    });

    /* =====================================================================
       RIGHT-SIDE MAP CONTROLS (preserved from export)
       ===================================================================== */
    /* ---- base map switcher (top-right, first in the stack): two clickable
       thumbnails (real tiles of Ghigo di Prali itself) instead of a text list ---- */
    var BasemapSwitch = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function(){
            var basemaps = [
                { key:'osm', layer:layer_OSMStandard_0, label:'OSM',
                  thumb:'https://tile.openstreetmap.org/13/4256/2950.png' },
                { key:'aerial', layer:layer_OpenTopoMap, label:'Aerial',
                  thumb:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/13/2950/4256' }
            ];
            var container = L.DomUtil.create('div', 'basemap-switch leaflet-control');
            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            var toggle = L.DomUtil.create('button', 'bm-toggle', container);
            toggle.type = 'button';
            toggle.title = lang==='it' ? 'Mappa di base' : 'Base map';
            toggle.setAttribute('aria-label', 'Base map');
            toggle.addEventListener('click', function(){ container.classList.toggle('expanded'); });

            var thumbs = L.DomUtil.create('div', 'bm-thumbs', container);
            var buttons = {};
            function collapse(){ container.classList.remove('expanded'); }
            function select(key){
                basemaps.forEach(function(b){
                    var isSel = b.key === key;
                    buttons[b.key].classList.toggle('sel', isSel);
                    if(isSel){ if(!map.hasLayer(b.layer)) map.addLayer(b.layer); }
                    else if(map.hasLayer(b.layer)) map.removeLayer(b.layer);
                });
                collapse();
            }
            basemaps.forEach(function(b){
                var btn = L.DomUtil.create('button', 'bm-btn'+(b.key==='osm' ? ' sel' : ''), thumbs);
                btn.type = 'button';
                btn.style.backgroundImage = "url('"+b.thumb+"')";
                btn.title = b.label;
                btn.setAttribute('aria-label', b.label);
                var lbl = L.DomUtil.create('span', 'bm-label', btn);
                lbl.textContent = b.label;
                btn.addEventListener('click', function(){ select(b.key); });
                buttons[b.key] = btn;
            });
            document.addEventListener('click', function(e){
                if(!container.contains(e.target)) collapse();
            });
            return container;
        }
    });
    map.addControl(new BasemapSwitch());
    L.control.zoom({ position:'topright' }).addTo(map);

    var measureControl = new L.Control.Measure({
        position:'topright', primaryLengthUnit:'meters', secondaryLengthUnit:'kilometers',
        primaryAreaUnit:'sqmeters', secondaryAreaUnit:'hectares'
    });
    measureControl.addTo(map);
    document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML='';
    document.getElementsByClassName('leaflet-control-measure-toggle')[0].className+=' fas fa-ruler';

    var _searchResult=null,_searchMarker=null;
    var photonControl=L.control.photon({
        url:'https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&',
        feedbackLabel:'', position:'topright', includePosition:true, initial:true
    }).addTo(map);
    photonControl._container.childNodes[0].style.borderRadius='10px';
    photonControl.on('selected',function(e){
        if(_searchResult!==null){ if(_searchMarker) map.removeLayer(_searchMarker); map.removeLayer(_searchResult); }
        _searchResult=L.geoJSON(e.choice).addTo(map);
        var label=e.choice.properties.label||e.choice.properties.display_name;
        _searchMarker=L.marker(_searchResult.getLayers()[0].getLatLng()).bindPopup(label).addTo(map);
        map.setView(_searchResult.getLayers()[0].getLatLng(),17);
        e.target.input.value=label;
    });
    var search=document.getElementsByClassName('leaflet-photon leaflet-control')[0];
    search.classList.add('leaflet-control-search'); search.style.display='flex';
    search.style.backgroundColor='rgba(255,255,255,0.5)';
    var searchBtn=document.createElement('div');
    searchBtn.id='gcd-button-control'; searchBtn.className='gcd-gl-btn fa fa-search search-button';
    search.insertBefore(searchBtn,search.firstChild);
    var searchPanel=search.lastChild; searchPanel.style.display='none';
    searchBtn.addEventListener('click',function(){ searchPanel.style.display=searchPanel.style.display==='none'?'block':'none'; });

    </script>
</body>
